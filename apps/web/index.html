<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="VSign — thử nghiệm nhận dạng từng ký hiệu Ngôn ngữ ký hiệu Việt Nam."
    />
    <title>VSign</title>
    <link rel="icon" type="image/svg+xml" href="/brand/vsign-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <style>
      /* Route and session are still unknown at first paint. */
      html, body { margin: 0; background: #f9f9fa; }
      .boot-frame { display: none; position: fixed; inset: 0; background: #f9f9fa; pointer-events: none; }
      html[data-workspace-boot] .boot-frame { display: block; }
      .boot-frame::before, .boot-frame::after { content: ""; position: absolute; box-sizing: border-box; }
      .boot-frame::before {
        top: 8px; right: 8px; bottom: 40px; left: var(--boot-sidebar, 212px);
        border: 1px solid rgb(0 0 0 / 10%); border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
      }
      .boot-frame::after { top: 60px; right: 9px; left: calc(var(--boot-sidebar, 212px) + 1px); height: 1px; background: rgb(0 0 0 / 10%); }
      @media (max-width: 1020px) { .boot-frame::before, .boot-frame::after { display: none; } }
    </style>
    <script>
      // Only a previously confirmed workspace in this tab may restore the shell before React loads.
      try {
        var workspacePath = /^\/(workspace|overview|recognize|data|evaluation|monitoring|models|activity|reports|integrations|team|settings)(\/|$)/.test(location.pathname);
        if (workspacePath && !new URLSearchParams(location.search).has("login") && sessionStorage.getItem("vsign.workspace-boot") === "ready") {
          var layout = JSON.parse(localStorage.getItem("vsign.sidebar") || "null") || {};
          var width = layout.collapsed ? 68 : Math.round(Math.min(360, Math.max(212, typeof layout.width === "number" ? layout.width : 212)));
          document.documentElement.style.setProperty("--boot-sidebar", width + "px");
          document.documentElement.setAttribute("data-workspace-boot", "");
        }
      } catch (error) { /* Storage unavailable: keep a neutral first paint. */ }
    </script>
  </head>
  <body>
    <div id="root"><div class="boot-frame" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
