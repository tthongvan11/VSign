[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsign-inference"
version = "0.1.0"
description = "FastAPI inference boundary for the VSign isolated-sign MVP"
requires-python = ">=3.9"
dependencies = [
  "av>=12.3.0,<19",
  "fastapi==0.115.12",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.15,<1.17",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "psycopg[binary]>=3.2,<4",
  "numpy==1.26.4",
  "pillow==11.2.1",
  "pydantic==2.11.5",
  "uvicorn[standard]==0.34.3"
]

[project.optional-dependencies]
onnx = ["onnxruntime==1.19.2"]
pytorch = [
  "torch==2.0.0",
  "torchvision==0.15.1"
]
test = [
  "httpx==0.28.1",
  "pytest==8.3.5"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
